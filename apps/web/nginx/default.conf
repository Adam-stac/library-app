# Keep the original https:// scheme when behind Cloudflare/Coolify
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 8080;
    server_name _;
    server_tokens off; # don't advertise the nginx version
    root /usr/share/nginx/html;

    # API calls go to the Spring Boot container on the internal Docker network
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off; # Docker's internal DNS
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        # Overwrite, never append: a client-supplied X-Forwarded-For must not be trusted (rate limiting uses it)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Built files have unique names, so browsers can cache them for a year
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Everything else is the React app; always check for a new version
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
