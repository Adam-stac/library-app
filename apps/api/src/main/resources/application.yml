# Shared settings. Real credentials are NEVER written here: they come from environment variables.
spring:
  application:
    name: library-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/library}
    username: ${DB_USERNAME:library_app}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Flyway owns the schema; Hibernate only checks it
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    default-encoding: UTF-8

server:
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
  health:
    mail:
      enabled: false # a slow mail server must not mark the whole API as "down"

app:
  base-url: ${APP_BASE_URL:http://localhost:3000} # used to build links in emails
  mail:
    from: ${MAIL_FROM:My Library <no-reply@library.local>}
  hibp:
    base-url: ${HIBP_BASE_URL:https://api.pwnedpasswords.com}
    timeout-ms: 3000
  rate-limit:
    auth:
      requests-per-minute: 10 # per client IP, across all /api/v1/auth endpoints
  password-hashing:
    max-concurrent: 4 # Argon2 uses 19 MiB each: caps memory at about 76 MiB under attack
