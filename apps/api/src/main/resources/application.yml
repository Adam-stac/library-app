# Shared settings. Real credentials are NEVER written here: they come from environment variables.
spring:
  application:
    name: library-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/library}
    username: ${DB_USERNAME:library_app}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Flyway owns the schema; Hibernate only checks it
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  session:
    jdbc:
      initialize-schema: never # Flyway creates the session tables
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    default-encoding: UTF-8

server:
  servlet:
    session:
      timeout: 12h # signed-in sessions end after 12 hours without activity
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
  health:
    mail:
      enabled: false # a slow mail server must not mark the whole API as "down"

app:
  base-url: ${APP_BASE_URL:http://localhost:3000} # used to build links in emails
  mail:
    from: ${MAIL_FROM:Khizana <no-reply@library.local>}
  hibp:
    base-url: ${HIBP_BASE_URL:https://api.pwnedpasswords.com}
    timeout-ms: 3000
  rate-limit:
    auth:
      requests-per-minute: 10 # per client IP, across all /api/v1/auth endpoints
    library:
      changes-per-minute: 120 # per signed-in account: adding, editing and deleting library records
  session:
    max-age: 7d # a sign-in ends after 7 days however active it is (idle limit: server.servlet.session.timeout)
  two-factor:
    # 32 random bytes, base64 (openssl rand -base64 32). Encrypts authenticator-app secrets at rest.
    # Required: the API refuses to start without it. Never commit a real key.
    encryption-key: ${TOTP_ENCRYPTION_KEY:}
  password-hashing:
    max-concurrent: 4 # Argon2 uses 19 MiB each: caps memory at about 76 MiB under attack
