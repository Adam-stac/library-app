name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: jobs can only read the code
permissions:
  contents: read

# On a pull request, a new push cancels the previous run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: apps/api/pom.xml
      - name: Build and test (real Postgres via Testcontainers)
        run: ./mvnw -B -ntp verify

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install pnpm
        run: npm install -g pnpm@12.14.0
      - name: Install dependencies (exactly as locked)
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @library-app/web lint
      - name: Typecheck
        run: pnpm --filter @library-app/web typecheck
      - name: Test
        run: pnpm --filter @library-app/web test
      - name: Build
        run: pnpm --filter @library-app/web build

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build API image
        run: docker build -t library-api:ci apps/api
      - name: Build web image
        run: docker build -t library-web:ci -f apps/web/Dockerfile .

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create a throwaway .env for this run
        run: |
          cp .env.example .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 24)|" .env
          sed -i "s|^TOTP_ENCRYPTION_KEY=.*|TOTP_ENCRYPTION_KEY=$(openssl rand -base64 32)|" .env
      - name: Start the full stack (Postgres, API, web)
        run: docker compose up -d --build --wait --wait-timeout 300
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install pnpm
        run: npm install -g pnpm@12.14.0
      - name: Install dependencies (exactly as locked)
        run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm --filter @library-app/web exec playwright install --with-deps chromium
      - name: End-to-end tests (Arabic and English, desktop and mobile, accessibility)
        run: pnpm --filter @library-app/web e2e
      - name: OWASP ZAP baseline scan of the running app
        run: |
          mkdir -p zap && chmod 777 zap && cp .zap/rules.tsv zap/
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:2.17.0 \
            zap-baseline.py -t http://localhost:3000 -c rules.tsv -r zap-report.html -J zap-report.json
      - name: Show container logs if something failed
        if: failure()
        run: docker compose logs --no-color
      - name: Keep the test and scan reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-reports
          path: |
            apps/web/playwright-report/
            zap/
          retention-days: 14
      - name: Stop the stack
        if: always()
        run: docker compose down -v
