name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: jobs can only read the code
permissions:
  contents: read

# On a pull request, a new push cancels the previous run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: apps/api/pom.xml
      - name: Production keeps the sign-in rate limit at 10 per minute
        working-directory: .
        run: |
          grep -Eq '^ +requests-per-minute: 10( |$)' apps/api/src/main/resources/application.yml
          if grep -n -i 'rate.limit' compose.yaml apps/api/src/main/resources/application-prod.yml; then
            echo "::error::The sign-in rate limit may only be raised in compose.test.yaml (browser tests)"
            exit 1
          fi
      - name: Build and test (real Postgres via Testcontainers)
        run: ./mvnw -B -ntp verify

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install pnpm
        run: npm install -g pnpm@12.14.0
      - name: Install dependencies (exactly as locked)
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @library-app/web lint
      - name: Typecheck
        run: pnpm --filter @library-app/web typecheck
      - name: Test
        run: pnpm --filter @library-app/web test
      - name: Build
        run: pnpm --filter @library-app/web build
      - name: Size budget
        run: pnpm --filter @library-app/web size

  visual:
    name: visual
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Playwright's own Linux image, the one `pnpm visual:docker` uses on your machine, so screenshots match exactly
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host --init
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The image is for the Playwright version the app uses
        run: |
          used=$(node -p "require('./apps/web/package.json').devDependencies['@playwright/test']")
          if [ "$used" != "1.64.1" ]; then
            echo "::error::@playwright/test is $used: update the image above (and in ci.yml only), then approve new screenshots with pnpm visual:docker --update-snapshots"
            exit 1
          fi
      - name: Let Git trust the checkout (the container runs as root; the files belong to the runner's user)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install pnpm
        run: npm install -g pnpm@12.14.0
      - name: Install dependencies (exactly as locked)
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm --filter @library-app/web build
      - name: Screenshots match, and every page reflows (320 px, 200% zoom, wider text spacing)
        run: pnpm --filter @library-app/web visual
      - name: Keep the differences if a screenshot changed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-differences
          path: |
            apps/web/visual-report/
            apps/web/visual-results/
          retention-days: 14

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build API image
        run: docker build -t library-api:ci apps/api
      - name: Build web image
        run: docker build -t library-web:ci -f apps/web/Dockerfile .

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create a throwaway .env for this run
        run: |
          cp .env.example .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 24)|" .env
          sed -i "s|^TOTP_ENCRYPTION_KEY=.*|TOTP_ENCRYPTION_KEY=$(openssl rand -base64 32)|" .env
      - name: Start the full stack (Postgres, API, web)
        run: docker compose up -d --build --wait --wait-timeout 300
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install pnpm
        run: npm install -g pnpm@12.14.0
      - name: Install dependencies (exactly as locked)
        run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm --filter @library-app/web exec playwright install --with-deps chromium
      - name: Load the made-up sample ISBN ranges through the import command
        # The real file is never in the repository (docs/operations/isbn-ranges.md); this also proves the command works
        run: pnpm --filter @library-app/web e2e:ranges
      - name: End-to-end tests (Arabic and English, desktop and mobile, accessibility)
        run: pnpm --filter @library-app/web e2e
      - name: OWASP ZAP baseline scan of the running app
        run: |
          mkdir -p zap && chmod 777 zap && cp .zap/rules.tsv zap/
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:2.17.0 \
            zap-baseline.py -t http://localhost:3000 -c rules.tsv -r zap-report.html -J zap-report.json
      - name: The access log holds no query strings
        # Proves the log format drops query strings (apps/web/nginx/default.conf), where search text and ISBN checks
        # travel. A request with a known marker is sent first, so the check never passes just because nothing was
        # asked. Only access-log lines are checked: nginx's error log can't drop them (accepted in the go-live
        # checklist)
        run: |
          curl -s -o /dev/null "http://localhost:3000/api/v1/search?q=query-string-marker"
          sleep 1
          log=$(docker compose logs web --no-color)
          if ! grep -qE '\] "GET /api/v1/search HTTP/' <<<"$log"; then
            echo "::error::The marker request isn't in the web container's access log, so it can't be checked"
            exit 1
          fi
          if grep -E '\] "[A-Z]+ [^" ]*\?|query-string-marker' <<<"$log"; then
            echo "::error::The web container's access log holds a query string (see the lines above)"
            exit 1
          fi
      - name: Show container logs if something failed
        if: failure()
        run: docker compose logs --no-color
      - name: Keep the test and scan reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-reports
          path: |
            apps/web/playwright-report/
            zap/
          retention-days: 14
      - name: Stop the stack
        if: always()
        run: docker compose down -v
