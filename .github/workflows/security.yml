name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # every Monday 06:00 UTC: catch newly published vulnerabilities

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, not just the latest commit
          persist-credentials: false
      - name: Install gitleaks (checksum verified)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSLO "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      - name: Scan the full Git history for secrets
        run: gitleaks git --redact --verbose .

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Block new dependencies with known high-severity vulnerabilities
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  image-scan:
    name: image-scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TRIVY_VERSION: 0.76.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build images
        run: |
          docker build -t library-api:scan apps/api
          docker build -t library-web:scan -f apps/web/Dockerfile .
      - name: Scan images for known vulnerabilities (fail on fixable HIGH/CRITICAL)
        run: |
          mkdir -p "$HOME/.cache/trivy"
          for image in library-api:scan library-web:scan; do
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$HOME/.cache/trivy:/root/.cache/trivy" \
              "aquasec/trivy:${TRIVY_VERSION}" image \
              --db-repository public.ecr.aws/aquasecurity/trivy-db,ghcr.io/aquasecurity/trivy-db \
              --java-db-repository public.ecr.aws/aquasecurity/trivy-java-db,ghcr.io/aquasecurity/trivy-java-db \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
              "$image"
          done
      - name: Generate SBOMs (CycloneDX)
        if: always()
        run: |
          mkdir -p sbom
          for name in api web; do
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$HOME/.cache/trivy:/root/.cache/trivy" \
              -v "$PWD/sbom:/out" \
              "aquasec/trivy:${TRIVY_VERSION}" image \
              --format cyclonedx --output "/out/sbom-${name}.cdx.json" --no-progress \
              "library-${name}:scan"
          done
      - name: Keep the SBOMs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/
          retention-days: 30
