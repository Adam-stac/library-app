# Dependabot opens pull requests when dependencies need updating.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      tooling:
        patterns: ["*"]
    commit-message:
      prefix: "chore"

  - package-ecosystem: "maven"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
    groups:
      spring:
        patterns: ["org.springframework*"]
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "docker"
    directories:
      - "/apps/api"
      - "/apps/web"
    schedule:
      interval: "weekly"
    ignore:
      # We stay on long-term-support versions and move between them deliberately:
      # Node LTS = even numbers (24, 26); Java LTS = 25, then 29.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore"
      include: "scope"
