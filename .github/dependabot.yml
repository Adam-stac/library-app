# Dependabot opens pull requests when dependencies need updating.
# Maven (apps/api) and Docker entries are added in Phase 2.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      tooling:
        patterns: ["*"]
    commit-message:
      prefix: "chore"

  - package-ecosystem: "maven"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
    groups:
      spring:
        patterns: ["org.springframework*"]
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "docker"
    directories:
      - "/apps/api"
      - "/apps/web"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
